name: Deploy

# Deploys main to the Hostinger VPS after CI passes.
#
# Dormant until switched on: the job is gated on the repository variable
# DEPLOY_ENABLED, so merging this file changes nothing. See docs/deployment.md
# for the variables and secrets it needs.
#
# `workflow_run` rather than `push`, so a deploy can only ever follow a green
# CI run on the same commit — the build is the gate (PRD §62).

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Manual re-deploy or rollback of a specific commit.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA to deploy (defaults to the tip of main)'
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Two gates. The first makes the workflow inert until someone deliberately
    # turns it on; the second refuses to deploy a commit whose CI was not green.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')

    # Requires the deploy secrets to live in a GitHub Environment with
    # reviewers, so a fork's pull request can never reach them.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    env:
      DEPLOY_PATH: /var/www/hugfab
      APP_NAME: hugfab

    steps:
      - name: Resolve the commit being deployed
        id: target
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            echo "sha=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Surfaced by /api/health, so the live commit is knowable without SSH.
          NEXT_PUBLIC_BUILD_SHA: ${{ steps.target.outputs.sha }}

      - name: Assemble the release bundle
        run: |
          set -euo pipefail
          # The application runs the ordinary Next server from its root via
          # index.js, so the release is the built app itself: no standalone
          # bundle and no asset-copying step that can be forgotten.
          # Dependencies are installed on the server, not shipped, so the
          # artefact carries no build-machine paths.
          mkdir -p release
          cp -r .next release/.next
          [ -d public ] && cp -r public release/public || true
          cp index.js package.json package-lock.json next.config.ts release/
          cp ecosystem.config.cjs release/
          echo "${{ steps.target.outputs.sha }}" > release/RELEASE_SHA
          du -sh release

      - name: Open the SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key rather than trusting on first use, so a redirected
          # DNS record cannot receive the deploy. Read from the environment,
          # not interpolated into the script: the value is multi-line.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set; falling back to ssh-keyscan (trust on first use)"
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload the release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RELEASE: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)-${RELEASE::7}"
          echo "RELEASE_DIR=$DEPLOY_PATH/releases/$STAMP" >> "$GITHUB_ENV"

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p $DEPLOY_PATH/releases/$STAMP"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            release/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/releases/$STAMP/"

      - name: Activate and reload
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -euo pipefail <<REMOTE
            # Production dependencies, installed from the lockfile on the host
            # so nothing native is carried across from the runner.
            cd "$RELEASE_DIR"
            npm ci --omit=dev --no-audit --no-fund

            # Secrets live only on the server, never in the build artefact.
            ln -sfn "$DEPLOY_PATH/shared/.env.production" "$RELEASE_DIR/.env.production"

            # Record what we are replacing, so the rollback step knows where to go.
            if [ -L "$DEPLOY_PATH/current" ]; then
              readlink -f "$DEPLOY_PATH/current" > "$DEPLOY_PATH/shared/previous_release"
            fi

            # Atomic: ln -sfn replaces the symlink in one operation.
            ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"

            cd "$DEPLOY_PATH/current"
            if pm2 describe $APP_NAME > /dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save
          REMOTE

      - name: Verify the release is actually live
        id: verify
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          # A 200 is not enough: the health endpoint reports the build SHA, so
          # this also proves the new release is the one serving traffic and not
          # a process that quietly kept running the old code.
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 10 "$PRODUCTION_URL/api/health" || true)"
            sha="$(printf '%s' "$body" | jq -r '.data.sha // empty')"
            status="$(printf '%s' "$body" | jq -r '.data.status // empty')"
            if [ "$sha" = "$EXPECTED_SHA" ] && [ "$status" = "ok" ]; then
              echo "Healthy on $sha"
              exit 0
            fi
            echo "attempt $attempt: status=${status:-none} sha=${sha:-none}"
            sleep 5
          done
          echo "::error::Health check never reported the deployed commit"
          exit 1

      - name: Roll back on a failed health check
        if: failure() && steps.verify.outcome == 'failure'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -euo pipefail <<REMOTE
            if [ -s "$DEPLOY_PATH/shared/previous_release" ]; then
              PREVIOUS="\$(cat $DEPLOY_PATH/shared/previous_release)"
              echo "Rolling back to \$PREVIOUS"
              ln -sfn "\$PREVIOUS" "$DEPLOY_PATH/current"
              cd "$DEPLOY_PATH/current"
              pm2 reload ecosystem.config.cjs --update-env
            else
              echo "No previous release recorded; leaving as-is for manual inspection."
            fi
          REMOTE
          echo "::error::Deploy failed health check and was rolled back"

      - name: Prune old releases
        if: success()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "ls -1dt $DEPLOY_PATH/releases/*/ | tail -n +6 | xargs -r rm -rf"
