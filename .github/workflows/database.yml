name: Database

# Migrations reach production the same way everything else does: merge to main.
# Nobody applies SQL by hand and nobody needs a local machine.
#
#   pull request  ->  prove locally, then dry run against production (no changes)
#   merge to main ->  prove locally, then apply
#
# Setup, one time, entirely in the GitHub UI
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   SUPABASE_PROJECT_ID     the ref in your dashboard URL,
#                           https://supabase.com/dashboard/project/<this>
#   SUPABASE_ACCESS_TOKEN   https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    Project Settings -> Database -> Database password
#
# SUPABASE_DB_PASSWORD is the database superuser password. It is a production
# credential and belongs in GitHub's secret store, never in the repository.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/database.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/database.yml'
  # So a migration can be re-applied after adding the secrets, without an
  # empty commit.
  workflow_dispatch:

# Never cancel a run that may be part-way through applying DDL. A cancelled
# migration leaves a schema nobody has a description of.
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: verify · ${{ github.event_name == 'push' && 'apply' || 'dry run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Gives the repository owner somewhere to require a manual approval before
    # production DDL (Settings -> Environments -> production -> Required
    # reviewers). With no rules configured it is a no-op, so this costs nothing
    # until it is wanted.
    environment: production

    # The same throwaway Postgres the CI job uses. Production is never touched
    # by a migration that has not just been applied to an empty database and
    # passed every assertion.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install the psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Prove the migrations apply to an empty database
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/verify-migration.sh

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Before the secrets exist, a pull request should say so rather than fail
      # red — the blocking gate for a PR is CI, not this. On main the same gap
      # is a real problem: migrations would silently never reach production, so
      # it fails loudly instead.
      - name: Check for the production credentials
        id: credentials
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          [ -z "$PROJECT_ID" ]   && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "$ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$DB_PASSWORD" ]  && missing="$missing SUPABASE_DB_PASSWORD"

          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::Missing repository secrets:$missing"
              echo "Migrations cannot reach production without them." >&2
              exit 1
            fi
            echo "::notice::Missing repository secrets:$missing — skipping the dry run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link the project
        if: steps.credentials.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: What is outstanding
        if: steps.credentials.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Dry run
        if: steps.credentials.outputs.ready == 'true' && github.event_name != 'push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # --linked is explicit so the target can never be ambiguous, and
        # --skip-vault because this project keeps no vault secrets in
        # config.toml — there is no config.toml at all.
        run: supabase db push --linked --dry-run --skip-vault

      - name: Apply
        if: steps.credentials.outputs.ready == 'true' && github.event_name == 'push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --skip-vault

      - name: Confirm what is applied
        if: steps.credentials.outputs.ready == 'true' && github.event_name == 'push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
